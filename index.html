<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산업안전기사 · 작업형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F7F5F0; --bg2:#F0EDE6; --surface:#FAFAF8; --surface2:#F3F0EB;
  --tx1:#1A1A1A; --tx2:#4A4A4A; --tx3:#9A9A9A; --tx4:#C4BFB6;
  --ink:#2D3A8C; --ink-lt:#EEF0FA; --ink-mid:rgba(45,58,140,.15);
  --ok:#1E7A4E; --ok-lt:#EDFAF3; --ok-border:#B6DECA;
  --ng:#C13B2A; --ng-lt:#FDF2F0; --ng-border:#F0C4BE;
  --star:#C4860A; --star-lt:#FEF8EC;
  --cA:#9B4B1A; --cA-lt:#FDF3EC;
  --cB:#1E4FA8; --cB-lt:#EEF3FC;
  --cC:#B02020; --cC-lt:#FCF0EF;
  --cD:#5B2B8A; --cD-lt:#F5F0FC;
  --cE:#1E6B3A; --cE-lt:#EEF9F3;
  --r1:6px; --r2:10px; --r3:14px; --r4:20px;
  --fast:100ms; --med:200ms; --slow:360ms;
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --sh1:0 1px 3px rgba(80,60,20,.06),0 1px 2px rgba(80,60,20,.04);
  --sh2:0 4px 12px rgba(80,60,20,.08),0 2px 4px rgba(80,60,20,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;font-size:14px;}
body{font-family:'Noto Sans KR',sans-serif;font-weight:300;background:var(--bg);color:var(--tx1);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--tx4);border-radius:99px;}

/* 헤더 */
.hdr{background:rgba(247,245,240,.92);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:0;z-index:300;}
.hi{max-width:1080px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#1a2f7a 0%,#2D3A8C 45%,#3d52c4 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(45,58,140,.30),inset 0 1px 0 rgba(255,255,255,.12);flex-shrink:0;position:relative;overflow:hidden;}
.logo-mark::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);border-radius:inherit;}
.logo-title{font-size:14px;font-weight:600;color:var(--tx1);letter-spacing:-.3px;line-height:1.2;}
.logo-sub{font-size:10px;color:var(--tx3);font-weight:300;letter-spacing:.2px;}
.hstats{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;}
.spill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;border:1px solid var(--tx4);font-size:11px;font-weight:300;color:var(--tx3);transition:all var(--med) var(--ease);}
.spill .sv{font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums;}
.spill.lit{border-color:var(--ink);background:var(--ink-lt);color:var(--ink);}
.spill.lit .sv{color:var(--ink);}
.prog-wrap{height:2px;background:var(--bg2);}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--ink),#5B8FE0);transition:width var(--slow) var(--ease);}

/* 컨트롤 */
.ctrl{background:rgba(250,250,248,.96);border-bottom:1px solid rgba(0,0,0,.05);backdrop-filter:blur(8px);}
.ci{max-width:1080px;margin:0 auto;padding:7px 22px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.cl{font-size:9px;font-weight:500;color:var(--tx4);letter-spacing:.8px;text-transform:uppercase;padding:0 4px;flex-shrink:0;}
.sep{width:1px;height:16px;background:var(--tx4);margin:0 4px;flex-shrink:0;}
.fb{padding:3px 10px;border-radius:99px;border:1px solid var(--tx4);background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:400;color:var(--tx3);cursor:pointer;transition:all var(--fast) var(--ease);white-space:nowrap;letter-spacing:-.1px;}
.fb:hover{border-color:var(--tx2);color:var(--tx1);}
.fb.on{background:var(--tx1);border-color:var(--tx1);color:#fff;font-weight:500;}
.fb.si.on{background:var(--cE);border-color:var(--cE);}
.fb.th.on{background:var(--cB);border-color:var(--cB);}
.fb.cA.on{background:var(--cA);border-color:var(--cA);}
.fb.cB.on{background:var(--cB);border-color:var(--cB);}
.fb.cC.on{background:var(--cC);border-color:var(--cC);}
.fb.cD.on{background:var(--cD);border-color:var(--cD);}
.fb.cE.on{background:var(--cE);border-color:var(--cE);}
.act{padding:3px 10px;border-radius:var(--r1);border:1px solid var(--tx4);background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:400;color:var(--tx2);cursor:pointer;transition:all var(--fast) var(--ease);}
.act:hover{background:var(--bg2);border-color:var(--tx2);}
.act-shuf{border-color:var(--ink);color:var(--ink);}
.act-shuf:hover{background:var(--ink-lt);}

/* 메인 */
.main{max-width:1080px;margin:0 auto;padding:16px 22px 80px;}
.nores{text-align:center;padding:80px 20px;color:var(--tx3);font-size:14px;font-weight:300;}

/* 섹션 */
.sec-hdr{display:flex;align-items:center;gap:10px;padding:18px 0 8px;}
.sec-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sec-nm{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--tx4),transparent);}
.sec-cnt{font-size:10px;color:var(--tx3);font-weight:300;white-space:nowrap;}
.sec-rst{padding:2px 8px;border-radius:99px;border:1px solid var(--tx4);background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--tx3);cursor:pointer;opacity:.7;transition:.15s;flex-shrink:0;}
.sec-rst:hover{opacity:1;border-color:var(--ng);color:var(--ng);}

/* 카드 */
.qc{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:var(--r4);margin-bottom:7px;box-shadow:var(--sh1);transition:border-color var(--med) var(--ease),box-shadow var(--med) var(--ease),transform var(--med) var(--ease);overflow:hidden;}
.qc:hover{border-color:rgba(0,0,0,.10);box-shadow:var(--sh2);transform:translateY(-1px);}
.qc.op{border-color:rgba(45,58,140,.18);box-shadow:0 0 0 1px rgba(45,58,140,.06),var(--sh2);}
.qc.starred{border-color:rgba(196,134,10,.35)!important;box-shadow:0 0 0 1px rgba(196,134,10,.12),var(--sh2)!important;}
.qc.all-correct{border-color:var(--ok-border)!important;box-shadow:0 0 0 1px rgba(30,122,78,.08),var(--sh2)!important;}

.qhdr{display:flex;align-items:center;padding:10px 14px;gap:8px;cursor:pointer;user-select:none;transition:background var(--fast) var(--ease);}
.qhdr:hover{background:rgba(0,0,0,.015);}
.qc.starred .qhdr{background:var(--star-lt);}
.qnum{width:26px;height:26px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0;letter-spacing:-.3px;}
.qcat{padding:2px 8px;border-radius:99px;font-size:9.5px;font-weight:500;flex-shrink:0;white-space:nowrap;border:1px solid transparent;}
.qpart{padding:2px 7px;border-radius:99px;font-size:9.5px;font-weight:400;background:var(--bg2);color:var(--tx3);border:1px solid var(--tx4);flex-shrink:0;white-space:nowrap;}
.qtitle{font-size:12.5px;font-weight:400;color:var(--tx1);flex:1;line-height:1.55;letter-spacing:-.2px;}
.qno{font-size:10px;color:var(--tx4);flex-shrink:0;font-variant-numeric:tabular-nums;}
.sbtn{background:none;border:none;font-size:14px;cursor:pointer;padding:3px;flex-shrink:0;color:var(--tx4);transition:color var(--fast) var(--ease),transform var(--fast) var(--spring);line-height:1;}
.sbtn:hover{transform:scale(1.2);}
.sbtn.on{color:var(--star);}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0;opacity:.7;}
.chev{color:var(--tx4);font-size:11px;flex-shrink:0;transition:transform var(--med) var(--ease);}
.qc.op .chev{transform:rotate(180deg);}

/* 카드 바디 - grid 애니메이션 */
.qbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--slow) var(--ease);}
.qc.op .qbody{grid-template-rows:1fr;}
.qbody-inner{overflow:hidden;}

/* 문제 내용 */
.qcon{padding:6px 16px 10px;border-top:1px solid rgba(0,0,0,.04);}
.qtext{padding:6px 0 3px;font-size:13.5px;font-weight:600;line-height:1.85;color:var(--tx1);white-space:pre-wrap;letter-spacing:-.1px;}
.scenario{background:rgba(45,58,140,.03);border-left:2px solid rgba(45,58,140,.25);padding:8px 12px;margin:6px 0;font-size:12.5px;line-height:1.75;color:var(--tx2);font-style:italic;border-radius:0 var(--r1) var(--r1) 0;}
.blank-highlight{display:inline-block;background:var(--ink-lt);border:1px solid var(--ink-mid);border-radius:4px;padding:1px 8px;color:var(--ink);font-weight:500;font-style:normal;min-width:48px;text-align:center;}

/* 문제 내 표 (빈칸 포함) */
.q-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px;font-weight:300;border:1px solid rgba(0,0,0,.08);border-radius:var(--r2);overflow:hidden;}
.q-table th{background:rgba(45,58,140,.06);color:var(--ink);padding:7px 11px;text-align:center;font-weight:600;border:1px solid rgba(45,58,140,.12);font-size:12px;}
.q-table td{border:1px solid rgba(0,0,0,.06);padding:6px 11px;vertical-align:middle;color:var(--tx2);font-size:12.5px;}
.q-table tr:nth-child(even) td{background:rgba(0,0,0,.02);}
.q-table td .blank-highlight{min-width:70px;}

/* 답안 */
.as{padding:8px 16px 12px;background:var(--bg2);border-top:1px solid rgba(0,0,0,.04);}
.as-lbl{font-size:9px;font-weight:500;color:var(--tx3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:8px;}
.as-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--tx4),transparent);}
.ta{width:100%;background:var(--surface);border:1px solid var(--tx4);border-radius:var(--r2);padding:8px 11px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:300;line-height:1.65;color:var(--tx1);resize:vertical;transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);}
.ta::placeholder{color:var(--tx4);font-weight:300;}
.ta:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(45,58,140,.08);}
.ta.ok,.sub-ta.ok{border-color:var(--ok)!important;background:var(--ok-lt)!important;box-shadow:0 0 0 2px rgba(30,122,78,.10)!important;}
.ta.ng,.sub-ta.ng{border-color:var(--ng)!important;background:var(--ng-lt)!important;box-shadow:0 0 0 2px rgba(193,59,42,.08)!important;}

/* 소문항 */
.sub-inputs{display:flex;flex-direction:column;gap:5px;}
.sub-row{display:flex;align-items:flex-start;gap:7px;}
.sub-label{border-radius:var(--r1);background:var(--surface);border:1px solid var(--tx4);color:var(--tx2);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;letter-spacing:-.3px;white-space:nowrap;padding:0 8px;height:30px;}
.sub-label.blank{background:var(--ink-lt);border-color:rgba(45,58,140,.25);color:var(--ink);font-weight:600;font-size:10px;letter-spacing:.1px;}
.sub-ta{flex:1;background:var(--surface);border:1px solid var(--tx4);border-radius:var(--r2);padding:6px 10px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:300;line-height:1.6;color:var(--tx1);resize:vertical;min-height:34px;transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);}
.sub-ta::placeholder{color:var(--tx4);}
.sub-ta:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 2px rgba(45,58,140,.08);}

/* N가지 */
.cnt-label{background:var(--surface);border:1px solid var(--tx4);color:var(--tx3);font-size:10px;font-weight:500;min-width:22px;height:22px;border-radius:5px;margin-top:5px;}
.sub-group{margin-bottom:5px;}
.sub-group-label{font-size:11px;font-weight:500;color:var(--tx2);background:var(--surface);border:1px solid var(--tx4);border-radius:var(--r1);padding:3px 10px;display:inline-block;margin-bottom:4px;}
.sub-group-items{display:flex;flex-direction:column;gap:4px;padding-left:8px;border-left:2px solid var(--tx4);}
.sub-item-row{display:flex;align-items:flex-start;gap:6px;}
.sub-item-num{min-width:20px;height:20px;border-radius:5px;background:var(--surface);border:1px solid var(--tx4);color:var(--tx3);font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:6px;}

/* 버튼 */
.brow{display:flex;gap:5px;margin-top:8px;align-items:center;flex-wrap:wrap;}
.b-check{padding:6px 16px;border-radius:99px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;cursor:pointer;background:var(--ink);color:#fff;box-shadow:0 2px 6px rgba(45,58,140,.25);transition:all var(--fast) var(--spring);letter-spacing:-.1px;}
.b-check:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(45,58,140,.30);}
.b-check:active{transform:translateY(0);}
.b-show{padding:6px 14px;border-radius:99px;border:1px solid var(--tx4);font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:400;cursor:pointer;background:var(--surface);color:var(--tx2);transition:all var(--fast) var(--ease);}
.b-show:hover{border-color:var(--tx2);color:var(--tx1);}
.b-rst{padding:6px 10px;border-radius:99px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:300;cursor:pointer;background:transparent;color:var(--tx3);transition:color var(--fast);}
.b-rst:hover{color:var(--ng);}
.cr{font-size:12.5px;font-weight:600;opacity:0;transform:translateY(4px) scale(.95);transition:all var(--med) var(--spring);flex-shrink:0;letter-spacing:-.2px;}
.cr.show{opacity:1;transform:translateY(0) scale(1);}
.cr.aok{color:var(--ok);}
.cr.part{color:var(--star);}
.cr.ang{color:var(--ng);}

/* 정답 패널 */
.ap{display:none;margin-top:8px;background:var(--ok-lt);border:1px solid var(--ok-border);border-radius:var(--r3);padding:10px 12px;animation:apIn var(--slow) var(--ease) both;}
@keyframes apIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.ap.show{display:block;}
.ap-lbl{font-size:9px;font-weight:600;color:var(--ok);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.ap-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--ok-border),transparent);}
.ans-sub-list{display:flex;flex-direction:column;gap:5px;}
.ans-sub-row{display:flex;align-items:flex-start;gap:7px;}
.ans-sub-lbl{padding:3px 8px;border-radius:99px;background:rgba(30,122,78,.1);border:1px solid var(--ok-border);color:var(--ok);font-size:10px;font-weight:600;flex-shrink:0;white-space:nowrap;align-self:flex-start;margin-top:2px;}
.ans-sub-cnt{flex:1;padding:6px 10px;background:rgba(255,255,255,.7);border:1px solid var(--ok-border);border-radius:var(--r1);font-size:12.5px;font-weight:300;line-height:1.7;color:var(--tx1);}
.ans-single{padding:7px 10px;background:rgba(255,255,255,.7);border:1px solid var(--ok-border);border-radius:var(--r1);font-size:12.5px;font-weight:300;line-height:1.75;color:var(--tx1);}
.ans-item{display:flex;align-items:flex-start;gap:7px;padding:4px 8px;margin:2px 0;background:rgba(30,122,78,.04);border-radius:5px;}
.ans-bullet{font-weight:600;color:var(--ok);font-size:12px;min-width:14px;flex-shrink:0;}
.ans-content{flex:1;font-size:12.5px;font-weight:300;line-height:1.55;color:var(--tx1);}
.ans-arrow{display:flex;align-items:flex-start;gap:7px;padding:2px 0;}
.ans-line{font-size:12.5px;font-weight:300;line-height:1.7;color:var(--tx1);padding:1px 0;}
.ans-table{width:100%;border-collapse:collapse;margin:5px 0;font-size:12px;font-weight:300;}
.ans-table th{background:rgba(30,122,78,.08);color:var(--ok);padding:5px 8px;text-align:center;font-weight:600;border:1px solid var(--ok-border);}
.ans-table td{border:1px solid var(--ok-border);padding:4px 8px;vertical-align:middle;color:var(--tx1);}
.ans-table tr:nth-child(even) td{background:rgba(30,122,78,.03);}

@keyframes correctPop{0%,100%{transform:translateY(0);}40%{transform:translateY(-3px);}}
.qc.pop-ok{animation:correctPop var(--slow) var(--spring);}

@media(max-width:640px){
  .hi{padding:9px 14px;gap:10px;}.main{padding:12px 14px 70px;}.qtitle{font-size:12px;}.qhdr{padding:9px 12px;gap:6px;}.hstats{gap:3px;}
}

/* ── 좌우 레이아웃 (문제 왼쪽, 정답 오른쪽) ── */
.card-body-layout{display:flex;border-top:1px solid rgba(0,0,0,.04);}
.card-left{flex:1;min-width:0;border-right:1px solid rgba(0,0,0,.05);}
.card-right{
  width:320px;flex-shrink:0;
  background:var(--ok-lt);
  border-left:1px solid var(--ok-border);
  display:none;flex-direction:column;
  animation:slideInRight var(--med) var(--ease) both;
}
.card-right.show{display:flex;}
@keyframes slideInRight{
  from{opacity:0;transform:translateX(10px);}
  to{opacity:1;transform:translateX(0);}
}
.ap-inner{padding:12px 14px;flex:1;overflow-y:auto;}
.ap-lbl{font-size:9px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.ap-lbl::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--ok-border),transparent);}
@media(max-width:860px){
  .card-body-layout{flex-direction:column;}
  .card-left{border-right:none;}
  .card-right{width:100%;border-left:none;border-top:1px solid var(--ok-border);animation:fadeUp var(--med) var(--ease) both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
}

/* 고르기 문제 보기 스타일 */
.choice-box{
  background:rgba(45,58,140,.04);
  border:1px solid rgba(45,58,140,.14);
  border-radius:var(--r2);
  padding:8px 12px;
  margin:6px 0;
  font-size:13px;
  font-weight:500;
  color:var(--tx1);
  line-height:1.8;
}
.choice-label{
  font-size:10px;font-weight:700;
  color:var(--ink);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:4px;
}

/* ── 기출/변형 탭 ── */
.tab-bar{
  background:rgba(250,250,248,.96);
  border-bottom:2px solid rgba(0,0,0,.06);
  display:flex;
  max-width:1080px;margin:0 auto;
  padding:0 22px;
}
.tab-btn{
  padding:10px 20px;
  border:none;background:transparent;
  font-family:'Noto Sans KR',sans-serif;
  font-size:13px;font-weight:500;
  color:var(--tx3);cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-2px;
  transition:all var(--med) var(--ease);
  letter-spacing:-.2px;
}
.tab-btn:hover{color:var(--tx1);}
.tab-btn.active{
  color:var(--ink);
  border-bottom-color:var(--ink);
  font-weight:600;
}
.tab-btn .tab-cnt{
  display:inline-block;
  margin-left:5px;
  padding:1px 6px;
  border-radius:99px;
  font-size:10px;font-weight:600;
  background:var(--bg2);
  color:var(--tx3);
  transition:all var(--med) var(--ease);
}
.tab-btn.active .tab-cnt{
  background:var(--ink-lt);
  color:var(--ink);
}
.tab-wrap{background:rgba(250,250,248,.96);}

/* ════════════════════════════════════════════════
   UX 고도화 CSS
   ════════════════════════════════════════════════ */

/* ── 1. 카드 오픈 시 카테고리 accent bar ── */
.qc.op .card-left {
  border-left: 3px solid var(--cat-accent, var(--ink));
}
.qc.op .card-body-layout {
  border-top: none;
}

/* ── 2. 오답 shake 애니메이션 ── */
@keyframes shakeIt {
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-5px);}
  30%{transform:translateX(4px);}
  45%{transform:translateX(-4px);}
  60%{transform:translateX(3px);}
  75%{transform:translateX(-2px);}
  90%{transform:translateX(1px);}
}
.sub-ta.ng.shake, .ta.ng.shake {
  animation: shakeIt 400ms cubic-bezier(.36,.07,.19,.97) both;
}

/* ── 3. 정답 flash 효과 ── */
@keyframes correctFlash {
  0%{background:rgba(30,122,78,.0);}
  25%{background:rgba(30,122,78,.10);}
  100%{background:rgba(30,122,78,.0);}
}
.qhdr.flash-ok {
  animation: correctFlash 600ms ease both;
}

/* ── 4. textarea auto-grow (JS로 제어, CSS는 min-height만) ── */
.ta, .sub-ta {
  overflow: hidden;
  transition: height 80ms ease, border-color var(--fast) var(--ease),
              box-shadow var(--fast) var(--ease),
              background var(--fast) var(--ease);
}

/* ── 5. 포커스 시 sub-label 색상 전환 ── */
.sub-row:focus-within .sub-label:not(.blank),
.sub-item-row:focus-within .sub-item-num,
.sub-row:focus-within .cnt-label {
  border-color: var(--ink);
  color: var(--ink);
  background: var(--ink-lt);
  transition: all var(--fast) var(--ease);
}

/* ── 6. 탭 전환 페이드 ── */
.main {
  transition: opacity 150ms var(--ease);
}
.main.fading {
  opacity: 0;
}

/* ── 7. 빈 상태 Empty State ── */
.empty-state {
  text-align: center;
  padding: 80px 30px 60px;
  color: var(--tx3);
}
.empty-state .es-icon {
  font-size: 52px;
  margin-bottom: 16px;
  display: block;
  filter: grayscale(20%);
}
.empty-state .es-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--tx2);
  margin-bottom: 8px;
}
.empty-state .es-desc {
  font-size: 13px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--tx3);
}

/* ── 8. 카테고리별 accent 색상 변수 ── */
.qc[data-cat="A"].op .card-left { border-left-color: var(--cA); }
.qc[data-cat="B"].op .card-left { border-left-color: var(--cB); }
.qc[data-cat="C"].op .card-left { border-left-color: var(--cC); }
.qc[data-cat="D"].op .card-left { border-left-color: var(--cD); }
.qc[data-cat="E"].op .card-left { border-left-color: var(--cE); }

/* ── 9. 진행 bar 카운팅 애니메이션 ── */
.sv {
  transition: all 300ms var(--ease);
}

/* ── 10. 채점 결과 부분 정답 progress bar ── */
.cr-bar-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transform: translateY(4px) scale(.95);
  transition: all var(--med) var(--spring);
}
.cr-bar-wrap.show { opacity: 1; transform: translateY(0) scale(1); }
.cr-bar {
  width: 60px; height: 5px;
  background: var(--tx4);
  border-radius: 99px;
  overflow: hidden;
  flex-shrink: 0;
}
.cr-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 400ms var(--ease) 100ms;
}

/* ── 11. 별표 버튼 호버 회전 ── */
.sbtn:hover { transform: scale(1.25) rotate(15deg); }

/* ── 12. 섹션 헤더 카운트 badge ── */
.sec-cnt {
  background: var(--bg2);
  padding: 1px 8px;
  border-radius: 99px;
  font-weight: 500;
}
</style>

ount": 3}, {"label": "(2)", "type": "paren", "count": 3}], "sub_answers": ["① 추락방호망 미설치\n② 안전난간 미설치\n③ 안전대 미착용", "① 추락방호망 설치\n② 안전난간 설치\n③ 안전대 착용 및 체결"], "cat": "A", "cat_desc": "피트 내 추락 재해"}, {"id": "sil_014", "part": "sil", "num": 14, "title": "사방에서 불꽃이 튀고 있는 산소 절단 작업 중, 야외 작업장 바닥에 여러 자재(철판, 목재, 인화성물질이라 표시된 페인트통)가 어지러이 널려 있고, 초록색 산소통이 절단 작업장 가까이에서 바닥에서 20도 정도로 눕혀 있으며 작업장에 소화기는 보이지 않는다. 용접용 보안면 등 안전 보호구를 착용하지 않은 여러 작업자들이 맨 얼굴로 목장갑을 끼고 용접하면서 산소통 줄을 당겨서 호스가 뽑혀 산소가 세나오고 불꽃이 튄다.", "q_text": "위험요인(3가지)", "a_text": "① 산소 용기가 바닥에 눕혀져 있음\n② 인근 가연성물질에 대한 방호조치 및 소화기구 없음\n③ 용접불티 비산방지덮개, 용접방화포 등 불꽃, 불티 등 비산방지조치 없음", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 산소 용기가 바닥에 눕혀져 있음\n② 인근 가연성물질에 대한 방호조치 및 소화기구 없음\n③ 용접불티 비산방지덮개, 용접방화포 등 불꽃, 불티 등 비산방지조치 없음"], "cat": "C", "cat_desc": "산소절단 작업 위험요인"}, {"id": "sil_015", "part": "sil", "num": 15, "title": "어지러운 작업장에서 용접봉 보안면, 가죽장갑, 앞치마를 착용한 작업자 한 명이 모재를 집게에 물려놓고 한 손으로 용접기, 다른 한 손으로 작업보을 받친 채 피복아크용접 작업을 하고 있다. 모재 옆에 작업대 위 어질러진 잡다한 물건들에 불티가 튀는 모습을 보여주고 있다.", "q_text": "용접 작업 시 불안전한 요인(3가지)", "a_text": "① 소화기구 비치 미흡\n② 불꽃, 불티 등 비산방지조치 미흡\n③ 화기작업에 따른 인근 가연성물질 방호조치 미흡", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 소화기구 비치 미흡\n② 불꽃, 불티 등 비산방지조치 미흡\n③ 화기작업에 따른 인근 가연성물질 방호조치 미흡"], "cat": "C", "cat_desc": "피복아크용접 불안전요인"}, {"id": "sil_016", "part": "sil", "num": 16, "title": "목장갑 착용 및 안전모 미착용한 작업자가 마그네틱 크레인으로 금형을 옮기려 한다. 마그네틱을 금형 위에 올리고 손잡이를 작동시키며 이동하려고 오른손으로는 금형을 잡고 왼손으로는 전기배선 외관에 피복이 벗겨져 있는 크레인 조정장치를 누르면서 이동하다가 넘어지면서 마그네틱 ON/OFF 봉을 건드려 금형이 발등 위로 떨어져 사고가 발생하였다. 사고의 위험요인(3가지)", "q_text": "", "a_text": "① 훅에 해지장치가 없음\n② 조정장치 전선 피복 상태가 불량함\n③ 위험장소에서 작업함\n④ 안전모를 미착용함\n⑤ 유도로프가 없음", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 훅에 해지장치가 없음\n② 조정장치 전선 피복 상태가 불량함\n③ 위험장소에서 작업함\n④ 안전모를 미착용함\n⑤ 유도로프가 없음"], "cat": "B", "cat_desc": "마그네틱 크레인 금형 이동"}, {"id": "sil_017", "part": "sil", "num": 17, "title": "섬유공장에서 실을 감는 섬유기계가 돌아가고 있고 장갑을 착용하던 작업자가 그 아래에서 일을 하 b_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["- 명칭: 접속선\n- 기능: 전위차를 줄임"], "cat": "D", "cat_desc": "정전기 방지 접속선"}, {"id": "i_006", "part": "i", "num": 6, "title": "산업안전보건법령 상, 화학설비/압력용기에 반응 폭주 등 급격한 압력 상승 우려가 있는 경우 설치해야 하는 안전장치는?", "q_text": "“보일러 및 배관, 그리고 밸브가 여러 개 보이고 화학 설비, 압력용기 등 부속설비를 보여주고 있음”", "a_text": "- 파열판\n- 안전 밸브", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["- 파열판\n- 안전 밸브"], "cat": "D", "cat_desc": "화학설비 파열판/안전밸브"}, {"id": "i_007", "part": "i", "num": 7, "title": "동영상에서 보이는 기계의 본체 전면 또는 측면에 부착된 이름판에 표시할 제원은? (3가지)", "q_text": "[📷 이미지 참조]", "a_text": "- 압력능력 및 규격\n- 형식번호 및 제조번호\n- 제조자명\n- 제조연월\n- 안전인증의 표시", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["- 압력능력 및 규격\n- 형식번호 및 제조번호\n- 제조자명\n- 제조연월\n- 안전인증의 표시"], "cat": "B", "cat_desc": "프레스 이름판 표시사항"}, {"id": "i_008", "part": "i", "num": 8, "title": "동영상에서 소형프레스에 사용할 수 있는 방호장치는?(5가지)(단, 프레스의 종류는 무관)", "q_text": "", "a_text": "광전자식\n양수조작식\n수인식\n게이트가드식\n손쳐내기식", "sub_inputs": [{"label": "", "type": "single", "count": 5}], "sub_answers": ["광전자식\n양수조작식\n수인식\n게이트가드식\n손쳐내기식"], "cat": "B", "cat_desc": "소형프레스 방호장치"}, {"id": "i_009", "part": "i", "num": 9, "title": "동영상에서 보이는 설비에 적용가능한 방호장치?(각 1가지씩)", "q_text": "① 컨베이어벨트를 안전하게 넘어 가기 위한 방호장치\n② 두 기계에 공통으로 설치 가능한 방호장치는?\n\n“영상에는 컨베이어 벨트와 덮개가 설치되지 않은 선반 및 연삭기가 차례로 보임”", "a_text": "① 건널 다리\n② 덮개(또는 울)", "sub_inputs": [{"label": "①", "type": "circle", "count": 1}, {"label": "②", "type": "circle", "count": 1}], "sub_answers": ["건널 다리", "덮개(또는 울)"], "cat": "B", "cat_desc": "컨베이어·선반·연삭기 방호장치"}, {"id": "i_010", "part": "i", "num": 10, "title": "동영상에서 작업자가 점검하고 있는 설비의 방호장치는?(3가지)", "q_text": "“건설용 리프트 출입문을 점검하고 있는 중 3상전원 차단장치와 비상정지장치 눌렀다가 돌리는 동작을 함”", "a_text": "- 출입문 연동장치\n- 비상정지장치\n- (3상) 전원차단장치\n- 권과방지장치\n- 과부하방지장치\n- 제동장치", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["- 출입문 연동장치\n- 비상정지장치\n- (3상) 전원차단장치\n- 권과방지장치\n- 과부하방지장치\n- 제동장치"], "cat": "A", "cat_desc": "건설용 리프트 방호장치"}, {"id": "i_011", "part": "i", "num": 11, "title": "시스템 비계 설치 기준 관련하여, 다음 질문에 적합한 답을 보기에서 고르면?", "q_text": "시스템 비계 설치 기준 관련하여, 다음 보기에서 적합한 답을 고르시오.\n\n[보기]\n벽 연결재 / 수직재 / 수평재 / 가새재\n10cm / 15cm / 20cm / 제조사가 정한 기준\n\n① 건축물 벽에 파이프 연결 구조물과 가설된 파이프 사이에 있는 것의 명칭은?\n② ①의 설치 간격은?", "a_text": "→ 벽 연결재\n→ 제조사가 정한 기준", "sub_inputs": [{"label": "①", "type": "circle", "count": 1}, {"label": "②", "type": "circle", "count": 1}], "sub_answers": ["벽 연결재", "제조사가 정한 기준"], "cat": "A", "cat_desc": "시스템 비계 설치 기준"}, {"id": "i_012", "part": "i", "num": 12, "title": "동영상의 안전난간 구조물 중에 필요한데, 누락된 것은?", "q_text": "[📷 이미지 참조]", "a_text": "- 발끝막이판", "sub_inputs": [{"label": "", "type": "single", "count": 1}], "sub_answers": ["- 발끝막이판"], "cat": "A", "cat_desc": "안전난간 누락 구조물"}, {"id": "i_013", "part": "i", "num": 13, "title": "산업안전보건법령 상, 동영상의 크레인 인양작업 중에, 유해위험을 방지하기 위한 관리감독자의 직무는?(3가지)(단, 작업시작 전 점검사항은 제외)", "q_text": "“이동식 크레인으로 비계를 인양 작업 중인데, 비계를 묶어 놓은 슬링벨트가 낡아 옆 부분이 찢어져 있음. 신호수 간에 신호 방법이 맞지 않고, 보조로프를 사용하지 않아 인양물이 흔들리며 건축 중인 철골에 부딪혀 작업자 위로 인양물이 떨어지는 장면이 연출됨”", "a_text": "- 작업방법과 근로자 배치를 결정하고 그 작업을 지휘하는 일\n- 재료의 결함 유무 또는 기구 및 공구의 기능을 점검하고 불량품을 제거하는 일\n- 작업 중 안전대 또는 안전모의 착용상황을 감시하는 일", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["- 작업방법과 근로자 배치를 결정하고 그 작업을 지휘하는 일\n- 재료의 결함 유무 또는 기구 및 공구의 기능을 점검하고 불량품을 제거하는 일\n- 작업 중 안전대 또는 안전모의 착용상황을 감시하는 일"], "cat": "A", "cat_desc": "크레인 인양작업 관리감독자 직무"}, {"id": "i_014", "part": "i", "num": 14, "title": "산업안전보건법령 상, 이삿짐 운반용 리프트 전도의 방지를 위해 사업주의 준수사항은?(빈칸채우기)", "q_text": "이삿짐 운반용 리프트 전도의 방지를 위해 사업주의 준수사항은?(빈칸채우기)\n\n( ________ )가 정해진 작동위치 또는 최대전개위치에 있지 않는 경우에는 사다리 붐 조립체를 펼친 상태에서 화물 운반작업을 하지 않을 것", "a_text": "→ 아웃트리거", "sub_inputs": [{"label": "빈칸1", "type": "blank", "count": 1}], "sub_answers": ["아웃트리거"], "cat": "A", "cat_desc": "이삿짐 운반용 리프트 전도 방지"}, {"id": "i_015", "part": "i", "num": 15, "title": "산업안전보건법령 상, 차량계 건설기계의 수리나 부속장치의 장착 및 제거작업을 하는 경우 그 작업을 지휘하는 사람의 준수 사항은?(2가지)", "q_text": "“덤프트럭(차량계 건설기계)에 앉아있던 운전자 A가 운전석에서 내려와 트럭의 적재함을 올리고 하역용 실린더 유압장치 밸브를 점검하고 있음. 적재함 아래 상체를 넣고 보고 있던 중 갑자기 유압 장치가 서서히 내려와서 작업자가 적재함 사이에 끼는 사고가 발생함. 작업자는 안전모는 착용하고 있고, 자동차 내부 시동장치에 열쇠가 꽂혀 있음.”", "a_text": "작업순서를 결정하고 작업을 지휘할 것\n안전지지대 또는 안전블록 등의 사용상황 등을 점검할 것", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["작업순서를 결정하고 작업을 지휘할 것\n안전지지대 또는 안전블록 등의 사용상황 등을 점검할 것"], "cat": "A", "cat_desc": "차량계 건설기계 수리 작업 지휘"}, {"id": "i_016", "part": "i", "num": 16, "title": "동영상 작업 중에 지켜야 할 안전 수칙은?(3가지)", "q_text": "“버스를 정비하기 위하여 차량용 리프트로 들어 올린 상태에서 작업자 A가 버스 밑에 들어가 샤프트계통을 점검하고 있는 중임. 그러던 중 작업자 B가 주변 상황을 전혀 살피지 않고 버스에 올라 엔진 시동을 걸었고, 그 순간 밑에 있던 작업자의 팔이 버스의 회전하는 샤프트에 말려들어가는 사고가 발생함. 작업장 주변에 작업 감시자는 보이지 않음.”", "a_text": "기동장치에 잠금장치를 하고 그 열쇠를 별도 관리\n정비작업 중임을 나타내는 표지판을 설치\n작업지휘자를 배치", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["기동장치에 잠금장치를 하고 그 열쇠를 별도 관리\n정비작업 중임을 나타내는 표지판을 설치\n작업지휘자를 배치"], "cat": "B", "cat_desc": "차량용 리프트 정비 안전수칙"}, {"id": "i_017", "part": "i", "num": 17, "title": "동영상에서 해당 ① 공작기계 조류와 ② 위험기계기구 자율안전확인기계에 지워지지 않도록 표시해야 할 사항은?(3가지)", "q_text": "[📷 이미지 참조]\n\n① 공작기계 종류\n② 위험기계기구 자율안전확인기계에 지워지지 않도록 표시해야 할 사항(3가지)", "a_text": "② 표시사항\n→ 밀링기\n- 제조자명, 주소, 모델번호, 제조번호 및 제조연도\n- 자율안전확인표시(KCs마크)", "sub_inputs": [{"label": "①", "type": "circle", "count": 1}, {"label": "②", "type": "circle", "count": 4}], "sub_answers": ["→ 밀링기", "① 제조자명, 주소, 모델번호, 제조번호 및 제조연도\n② 기계의 중량\n③ 스핀들의 회전수 범위\n④ 자율안전확인표시(KCs마크)"], "cat": "B", "cat_desc": "밀링기 자율안전확인기계 표시사항"}, {"id": "i_018", "part": "i", "num": 18, "title": "![image.png](image%203.png)", "q_text": "(가) 화면에 보이는 건설 작업 중 쓰이는 양중기 운반구 이름은?\n\n(나) 사업주는 해당 운반구에 근로자를 탑승시켜서는 아니 되지만, 추락 위험을 방지하기 위하여 예외적으로 작업자가 탑승시키기 위해서 필요한 조치는?”(2가지)", "a_text": "① 탑승설비가 뒤집히거나 떨어지지 않도록 필요한 조치를 할 것\n② 안전대나 구명줄을 설치하고, 안전난간을 설치할 수 있는 구조인 경우에는 안전난간을 설치할 것\n③ 탑승설비를 하강시킬 때에는 동력하강방법으로 할 것\n곤돌라", "sub_inputs": [{"label": "", "type": "single", "count": 4}], "sub_answers": ["① 탑승설비가 뒤집히거나 떨어지지 않도록 필요한 조치를 할 것\n② 안전대나 구명줄을 설치하고, 안전난간을 설치할 수 있는 구조인 경우에는 안전난간을 설치할 것\n③ 탑승설비를 하강시킬 때에는 동력하강방법으로 할 것\n곤돌라"], "cat": "A", "cat_desc": "곤돌라 근로자 탑승 조치"}, {"id": "i_019", "part": "i", "num": 19, "title": "산업안전보건법령 상, 다음 중 사업주가 해당 작업에 종사하는 근로자가 준수하도록 할 사항으로 옳은 것은?(고르기)", "q_text": "산업안전보건법령 상, 다음 중 사업주가 해당 작업에 종사하는 근로자가 준수하도록 할 사항으로 옳은 것을 고르시오.\n\nA. 얼어붙은 다이나마이트는 화기에 접근시켜서 융해시킨다.\nB. 장전구는 마찰/충격/정전기 등에 의한 폭발의 위험이 없는 안전한 것을 사용할 것\nC. 발파공의 충진재료는 점토/모래 등 발화성 또는 인화성의 위험이 없는 재료를 사용할 것\nD. 얼어붙은 다이나마이트는 고열물에 직접 접촉시켜 융해시킨다.", "a_text": "B, C", "sub_inputs": [{"label": "정답", "type": "blank", "count": 1}], "sub_answers": ["B, C"], "cat": "D", "cat_desc": "발파작업 안전수칙"}, {"id": "i_020", "part": "i", "num": 20, "title": "사업주가 인화성액체 위험물을 액체상태로 저장하는 저장탱크를 설치하는 경우에는 위험물질이 누출되어 확산되는 것을 방지하는 것의 명칭은?", "q_text": "", "a_text": "방유제", "sub_inputs": [{"label": "", "type": "single", "count": 1}], "sub_answers": ["방유제"], "cat": "D", "cat_desc": "인화성액체 방유제"}, {"id": "i_021", "part": "i", "num": 21, "title": "동영상에서 선반작업을 하고 있다.", "q_text": "② 선반에서 절삭 가공시 발생하는 칩을 짧게 끊어지도록 공구에 설치되어 있는 방호장치의 명칭\n\n## 방호구", "a_text": "① 해당 작업 장치의 명징\n→ 선반\n→ 칩브레이커", "sub_inputs": [{"label": "①", "type": "circle", "count": 1}, {"label": "②", "type": "circle", "count": 1}], "sub_answers": ["선반", "칩브레이커"], "cat": "B", "cat_desc": "선반·칩브레이커"}, {"id": "i_022", "part": "i", "num": 22, "title": "작업자가 쓰고 있는 안전모를 확대하여 보여주고 있다.", "q_text": "안전인증대상 안전모의 종류 (3가지)\n각 종류의 기호, 용도, 특성을 쓰시오.", "a_text": "① AB: 물체 낙하/비래, 추락 방지용 / 비내전압성\n② ABE: 물체 낙하/비래, 추락 및 감전 방지용 / 내전압성 7000V 이하\n③ AE: 물체 낙하/비래, 감전 방지용 / 내전압성 7000V 이하", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① AB: 물체 낙하/비래, 추락 방지용 / 비내전압성\n② ABE: 물체 낙하/비래, 추락 및 감전 방지용 / 내전압성 7000V 이하\n③ AE: 물체 낙하/비래, 감전 방지용 / 내전압성 7000V 이하"], "cat": "E", "cat_desc": "안전모 종류"}, {"id": "i_023", "part": "i", "num": 23, "title": "화면에는 위의 보호구를 확대하여 보여주고 있다.", "q_text": "[📷 이미지 참조]\n(1) 해당 보호구의 명칭\n(2) 해당 보호구의 정의\n(3) 해당 보호구가 갖추어야 하는 구조조건(2가지)", "a_text": "→ 안전블록\n\n→ 안전그네와 연결하여 추락발생 시 추락을 억제할 수 있는 자동잠김장치가 있어 죔줄 : "목재가공용 둥근톱 안전수칙"}, {"id": "i_056", "part": "i", "num": 56, "title": "보안경을 착용하지 않은 작업자가 고개를 숙이며 띠톱작업 중 자재를 꺼내려다 톱날에 장갑이 걸려 들어가는 사고가 발생하였다. 사고 위험요인(3가지)", "q_text": "", "a_text": "① 자재를 꺼낼 때 전원을 차단하지 않아 위험(정전작업 미실시)\n② 띠톱작업 시 장갑 착용하여 위험\n③ 자재를 꺼낼 때 수공구 사용하지 않아 위험", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 자재를 꺼낼 때 전원을 차단하지 않아 위험(정전작업 미실시)\n② 띠톱작업 시 장갑 착용하여 위험\n③ 자재를 꺼낼 때 수공구 사용하지 않아 위험"], "cat": "B", "cat_desc": "띠톱 작업 위험요인"}, {"id": "i_057", "part": "i", "num": 57, "title": "안전모와 보안경을 착용하지 않은 작업자가 방호장치가 설치되지 않은 드릴을 이요하여 구멍을 넓히는 작업을 하고 있다. (단, 작업자는 목장갑을 끼고 공작물을 손으로 잡고 있다) 위험요인(2가지)", "q_text": "", "a_text": "① 안전모, 보안경 등 보호구 미착용\n② 목장갑을 끼고 드릴 사용", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 안전모, 보안경 등 보호구 미착용\n② 목장갑을 끼고 드릴 사용"], "cat": "B", "cat_desc": "드릴 작업 위험요인"}, {"id": "i_058", "part": "i", "num": 58, "title": "보안경을 착용하지 않고 장갑을 착용한 작업자가 드릴작업을 하면서 칩과 같은 이물질을 입으로 불어서 제거하고 이 후에 손으로 칩을 제거하다 드릴에 손이 다치는 재해가 발생하였다. 위험요인(2가지)", "q_text": "", "a_text": "① 보안경을 착용하지 않아 이물질이 눈에 들어갈 위험 있음\n② 브러시를 사용하지 않고 장갑을 착용한 손으로 이물질을 제거하다 손을 다칠 위험이 있음", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 보안경을 착용하지 않아 이물질이 눈에 들어갈 위험 있음\n② 브러시를 사용하지 않고 장갑을 착용한 손으로 이물질을 제거하다 손을 다칠 위험이 있음"], "cat": "B", "cat_desc": "드릴 작업 칩 제거"}, {"id": "i_059", "part": "i", "num": 59, "title": "목장갑을 낀 작업자가 드릴 작업을 하던 도중에 손으로 칩을 치우며 입으로 불고 있다가 드릴 부분에 손이 닿아 목장갑이 말려 들어가 손가락에서 피가 나는 장면을 보여주고 있다.", "q_text": "(1) 위험점\n(2) 정의", "a_text": "→ 회전말림점\n→ 회전하는 물체에 작업복, 머리카락 등이 말려들어가는 위험점", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["→ 회전말림점", "→ 회전하는 물체에 작업복, 머리카락 등이 말려들어가는 위험점"], "cat": "B", "cat_desc": "드릴 회전말림점"}, {"id": "i_060", "part": "i", "num": 60, "title": "작업자가 김치 제조공장에서 무채를 썰어내는 슬라이스 기계를 작업하던 도중 기계가 갑자기 멈추자 작업자가 이를 점검하던 중에 갑자기 슬라이스 기계가 작동하여 손가락이 절단되었다.", "q_text": "(1) 위험점 및 정의\n(2) 위험요인(2가지)\n(3) 방호장치(3가지)", "a_text": "→ 절단 고 확인"], "cat": "C", "cat_desc": "변압기 활선 확인"}, {"id": "i_090", "part": "i", "num": 90, "title": "작업자가 발파 후에 작반 위험을 방지하기 위한 부석의 유무 또는 불발화약의 유무를 확인하기 위하여 발파 작업장에 접근하려 한다.", "q_text": "각각 발파 후 몇 분이 경과한 후에 접근해야 하는지 쓰시오.", "a_text": "① 전기뇌관에 의한 발파인 경우: 5분 이상\n② 전기뇌관 이외에 의한 발파인 경우: 15분 이상\n\n## 화학", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 전기뇌관에 의한 발파인 경우: 5분 이상\n② 전기뇌관 이외에 의한 발파인 경우: 15분 이상\n\n## 화학"], "cat": "D", "cat_desc": "발파 후 접근 시간"}, {"id": "i_091", "part": "i", "num": 91, "title": "작업자가 DMF(디메텔포름아미드) 작업장에서 각종 보호구를 착용하지 않은 채 드럼(DMF라고 쓰여 있음)을 통해 유해물질 DMF 작업을 하고 있다.", "q_text": "(1) DMF를 사용하는 작업장에서 쓰이는 모든 대상화학물질에 대한 물질안전보건자료를 근로자가 쉽게 볼 수 있게 게시 또는 갖추어 두고 정기 또는 수시로 점검 및 관리하는 장소(3가지)\n(2) 피부 자극성 및 부식성 관리대상 유해물질 취급 시 비치하여야 할 보호구(3가지)\n(3) 피부 자극성 및 부식성 관리대상 유해물질 취급장소에 게시하여야 하는 사항(3가지)", "a_text": "① 물질안전보건자료 대상 물질을 취급하는작업공정이 있는 장소 \n② 작업장 내 근로자가 가장 보기 쉬운 장소\n③ 근로자가 작업 중 쉽게 접근할 수 있는 장소에 설치된 전산장비\n\n① 불침투성 보호복 (화학물질용 보호복)\n② 불침투성 보호장갑 (화학물질용 안전장갑)\n③ 불침투성 보호장화 (화학물질용 안전화)\n\n① 제품명\n② 안전 및 보건상의 취급주의 사항\n③ 적절한 보호구", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 3}, {"label": "(2)", "type": "paren", "count": 3}, {"label": "(3)", "type": "paren", "count": 3}], "sub_answers": ["① 물질안전보건자료 대상 물질을 취급하는작업공정이 있는 장소 \n② 작업장 내 근로자가 가장 보기 쉬운 장소\n③ 근로자가 작업 중 쉽게 접근할 수 있는 장소에 설치된 전산장비", "① 불침투성 보호복 (화학물질용 보호복)\n② 불침투성 보호장갑 (화학물질용 안전장갑)\n③ 불침투성 보호장화 (화학물질용 안전화)", "① 제품명\n② 안전 및 보건상의 취급주의 사항\n③ 적절한 보호구"], "cat": "D", "cat_desc": "DMF 작업 보호구·MSDS"}, {"id": "i_092", "part": "i", "num": 92, "title": "작업자 2명이 각자 유해물질이 들어있는 드럼통 하나씩 옮기고 있고, 맨손 작업자는 드럼통을 눕힌 채 굴리며 옮기고, 장갑을 착용한 작업자는 옆으로 살짝 기울여 돌리고 있다. 맨손 작업자가 드럼통을 세우다가 허리를 삐끗하여 넘어지고 발목을 잡고 아파하고, 세우려던 드럼통은 다시 제자리로 굴러가는 장면을 보여준다.", "q_text": "드럼통 운반 시 위험요인(2가지)", "a_text": "① 구름멈춤대, 쐐기 등을 이용하여 중량물의 동요나 이동을 조절하지 않음\n② 중량물이 구르는 방향인 경사면 아래로는 근로자의 출입을 제한하지 않음", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 구름멈춤대, 쐐기 등을 이용하여 중량물의 동요나 이동을 조절하지 않음\n② 중량물이 구르는 방향인 경사면 아래로는 근로자의 출입을 제한하지 않음"], "cat": "B", "cat_desc": "드럼통 운반 위험요인"}, {"id": "i_093", "part": "i", "num": 93, "title": "노란색 아세틸렌가스통 보관소는 위에 창문만 조그만 것이 있다. (환풍기는 확인되지 않음)앞쪽 같은 공간에 회색 가스 용기가 하나 있다. 아세틸렌 가스 보관소 문 밖에서 약 3m 이상 떨어져서 작업자가 연삭기 숫돌로 작업 중에 불꽃이 튄다. 다른 작업자가 아세틸렌 가스통 점검하는데, 손으로 밸브를 돌려보고 나온다.", "q_text": "아세틸렌 보관장소의 위험요인(2가지)", "a_text": "① 적당한 소화설비를 설치하지 않았음\n② 통풍이나 환기가 불충분함", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 적당한 소화설비를 설치하지 않았음\n② 통풍이나 환기가 불충분함"], "cat": "D", "cat_desc": "아세틸렌 보관장소 위험요인"}, {"id": "i_094", "part": "i", "num": 94, "title": "작업자가 폭발성 화학물질을 취급하는 실험실 안에 들어가기 전 신발에 물을 묻히고 들어가서 작업한다. 다른 작업장에는 바닥에 가루가 떨어져 있다. 작업자가 작업장에 들어가는데, 신발이 미끄러지듯 하더니 신발 바닥에서 불꽃이 발생한다.", "q_text": "(1) 신발에 물을 묻히는 이유\n(2) 화재 시 적합한 소화방법", "a_text": "→ 작업화와 바닥면의 접촉으로 인한 정전기(점화원) 발생을 줄이기 위해서\n\n→ 다량 주수에 의한 냉각소화", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["→ 작업화와 바닥면의 접촉으로 인한 정전기(점화원) 발생을 줄이기 위해서", "→ 다량 주수에 의한 냉각소화"], "cat": "D", "cat_desc": "폭발성 화학물질 실험실 정전기"}, {"id": "i_095", "part": "i", "num": 95, "title": "작업자가 주황색 수소통이 있는 저장창고로 들어가는 모습을 보여주고 있다. 방폭형 전원스위치가 보이고, 작업장 뒤쪽 상단의 일반 환풍기는 작동하지 않고, 환풍기 전서의 전기 콘센트는 방폭형이 아닌 일반형이다.", "q_text": "수소의 특성(2가지)", "a_text": "① 무색 무취로 누출 감지 어려움\n② 물질 중 가장 가벼움\n③ 폭발 위험성이 크고 연소 시 발열량이 큼", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 무색 무취로 누출 감지 어려움\n② 물질 중 가장 가벼움\n③ 폭발 위험성이 크고 연소 시 발열량이 큼"], "cat": "D", "cat_desc": "수소 저장창고 특성"}, {"id": "i_096", "part": "i", "num": 96, "title": "화면에는 특수화학설비 시설을 보여주고 있다.", "q_text": "(1) 특수화학설비 내부의 이상상태를 조기에 파악하기 위하여 설치해야 할 계측장치(3가지)\n(2) 특수화학설비 내부의 이상상태를 조기에 파악하기 위하여 설치해야 할 장치(3가지, 단 계측장치 제외)", "a_text": "① 온도계\n② 유량계\n③ 압력계\n\n① 자동경보장치\n② 긴급차단장치\n③ 예비동력원", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 3}, {"label": "(2)", "type": "paren", "count": 3}], "sub_answers": ["① 온도계\n② 유량계\n③ 압력계", "① 자동경보장치\n② 긴급차단장치\n③ 예비동력원"], "cat": "D", "cat_desc": "특수화학설비 계측장치"}, {"id": "i_097", "part": "i", "num": 97, "title": "연구실에서 안전장갑을 끼지 않은 상태에서 황산으로 유리용기를 세척하던 도중 작업자에게 황산이 손에 묻어 사고가 발생하였다.", "q_text": "(1) 재해형태 및 정의\n(2) 실내작업장의 바닥이 갖추어야 할 조건(2가지)", "a_text": "① 불침투성 재료\n② 청소하기 쉬운 구조", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 2}], "sub_answers": ["→ 화학물질 노출/접촉: 유해, 위험물질 노출/접촉 또는 흡입하였거나 독성동물에 쏘이거나 물린 경우", "① 불침투성 재료\n② 청소하기 쉬운 구조"], "cat": "D", "cat_desc": "황산 세척 재해형태"}, {"id": "i_098", "part": "i", "num": 98, "title": "위험물질 실험실에서 위험물이 든 병을 발로 차서 깨뜨리는 장면을 보여주고 있다.", "q_text": "위험물을 다루는 옥외설비 바닥이 갖추어야 할 조건(2가지)", "a_text": "① 누출 시 액체가 외부로 확산되지 않도록 바닥의 둘레에 높이 15cm 이상의 턱 설치\n② 바닥은 콘크리트 기타 불침투성 재료로 하고, 턱이 있는 쪽이 낮게 경사지게 할 것", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 누출 시 액체가 외부로 확산되지 않도록 바닥의 둘레에 높이 15cm 이상의 턱 설치\n② 바닥은 콘크리트 기타 불침투성 재료로 하고, 턱이 있는 쪽이 낮게 경사지게 할 것"], "cat": "D", "cat_desc": "위험물 옥외설비 바닥 조건"}, {"id": "i_099", "part": "i", "num": 99, "title": "보호구를 아무것도 착용하지 않은 작업자가 유해한 화학물질을 맨손으로 취급하고 있다. 유해물질이 흡수되는 경로(3가지)", "q_text": "", "a_text": "① 호흡기\n② 소화기\n③ 피부", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 호흡기\n② 소화기\n③ 피부"], "cat": "D", "cat_desc": "유해물질 흡수 경로"}, {"id": "i_100", "part": "i", "num": 100, "title": "화기주의, 인화성 물질이라고 써 있는 드럼통(200L)이 여러 개 보관된 창고 안에서 작업자가 인화성 물질이 든 운반용 캔(약 40L)을 몇 개 운반하다가 잠시 쉰다. 작업자가 작은 용기에 있는 걸 큰 용기에 담기 위해 드럼통 뚜껑을 열고 더운지 작업자가 스웨터를 벗는 도중에 폭발사고가 발생하였다.", "q_text": "(1) 폭발의 종류\n(2) 정의\n(3) 인화성 물질의 증기/가연성가스 또는 분진이 존재하여 폭발 또는화재가 발생할 우려가 있을 경우의 예방대책(3가지)", "a_text": "→ 증기운 폭발 = VCE\n\n→ 인화성 가스가 대기 중에 존재하다가 점화원(정전기)에 의해 폭발\n\n① 환기가 충분하지 않으 ㄴ상태에서 전기기계기구를 작동시키지 않음\n② 환풍기, 배풍기 등 환기장치를 적절하게 설치\n③ 가스 검지 및 경보 성능을 갖춘 가스 검지 및 경보 장치를 설치", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}, {"label": "(3)", "type": "paren", "count": 3}], "sub_answers": ["→ 증기운 폭발 = VCE", "→ 인화성 가스가 대기 중에 존재하다가 점화원(정전기)에 의해 폭발", "① 환기가 충분하지 않으 ㄴ상태에서 전기기계기구를 작동시키지 않음\n② 환풍기, 배풍기 등 환기장치를 적절하게 설치\n③ 가스 검지 및 경보 성능을 갖춘 가스 검지 및 경보 장치를 설치"], "cat": "D", "cat_desc": "인화성물질 증기운 폭발"}, {"id": "i_101", "part": "i", "num": 101, "title": "화면에서 프로판가스 용기들을 보여주고 있다. 작업자가 LPG저장소라고 표시되어 있는 문을 열고 들어가는데, 어두워서 들어 가자마자 왼쪽에 있는 스위치를 눌러서 불을 점등하려는 순간 스파크로 인해서 폭발이 일어나는 화면을 보여 준다.", "q_text": "프로판가스 용기 저장소로서 부적합한 장소(3가지)", "a_text": "① 통풍이나 환기가 불충분한 장소\n② 화기를 사용하는 장소 및 그 부근\n③ 위험물 또는 인화성 액체를 취급하는 장소 및 그 부근", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 통풍이나 환기가 불충분한 장소\n② 화기를 사용하는 장소 및 그 부근\n③ 위험물 또는 인화성 액체를 취급하는 장소 및 그 부근"], "cat": "D", "cat_desc": "프로판가스 저장소 부적합 장소"}, {"id": "i_102", "part": "i", "num": 102, "title": "해당 LPG저장소에는 가스누설감지경보기가 설치되지 않아 작업자들이 가스 폭발사고를 당했다.", "q_text": "(1) 누설감지경보기 적절한 설치 위치\n(2) 누설감지경보기 경보설정 값", "a_text": "→ LPG는 공기보다 무거우므로 바닥 근처 낮은곳에 설치\n\n→ 폭발하한계의 25% 이하", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["→ LPG는 공기보다 무거우므로 바닥 근처 낮은곳에 설치", "→ 폭발하한계의 25% 이하"], "cat": "D", "cat_desc": "LPG 가스 누설감지경보기"}, {"id": "i_103", "part": "i", "num": 103, "title": "작업자가 LPG저장소라고 표시되어 있는 문을 열고 들어가는데, 어두워서 들어 가자마자 왼쪽에 있는 스위치를 눌러서 불을 점등하려는 순간 스파크로 인해서 폭발이 일어나는 화면을 보여 준다.", "q_text": "(1) 재해형태\n(2) 기인물", "a_text": "→ 폭발\n\n→ LPG", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["→ 폭발", "→ LPG"], "cat": "D", "cat_desc": "LPG 폭발 재해형태"}, {"id": "i_104", "part": "i", "num": 104, "title": "화면에서 화학물질을 소분하여 저장한 통에 MSDS 라벨을 부착한 모습을 확대하여 보여 주고 있다.", "q_text": "산업안전보건법 상 화학물질 또는 이를 포함한 혼합물로서 유해인자의 분류기준에 해당하는 것(물질안전보건자료 대상물질은 제외)을 제조하거나 수입하려는 자는 다음 각호의 사항을 적은 물질안전보건자료를 고용노동부령으로 정하는 바에 따라 작성하여 고용노동부장관에게 제출하여야 한다. 이 경우 물질안전보건자료에 작성하여야 하는 사항(4가지)", "a_text": "① 제품명\n② 안전 및 보건상의 취급 주의 사항\n③ 안전 및 보건상의 취급 주의 사항\n④ 물리, 화학적 특성 등 고용노동부령으로 정하는 사항", "sub_inputs": [{"label": "", "type": "single", "count": 4}], "sub_answers": ["① 제품명\n② 안전 및 보건상의 취급 주의 사항\n③ 축력 측정"], "cat": "A", "cat_desc": "터널 굴착 계측 방법"}, {"id": "i_116", "part": "i", "num": 116, "title": "위에서 작업하던 작업자가 크레인으로 배관을 인양하던 도중 작업자들 머리 부근가지 내려온다. 밑에는 2명의 작업자가 배관을 손으로 지지하는데 배관이 순간 흔들리면서 날아와 작업자 1명의 안전모를 쳐버린다.", "q_text": "(1) 재해형태\n(2) 정의", "a_text": "→ 맞음\n\n→ 날아오거나 떨어진 물건에 맞음", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["→ 맞음", "→ 날아오거나 떨어진 물건에 맞음"], "cat": "A", "cat_desc": "크레인 배관 인양 맞음"}, {"id": "i_117", "part": "i", "num": 117, "title": "폭바 스위치 장비가 보이는 터널 내부에서 작업자가 강봉(철근)으로 장전구 안에 화약을 안으로 4~5개 정도 밀어 넣고, 접속한 전선을 꼬아서 주변 선들 위에 올려놓는 장면이다.", "q_text": "(1) 화약장전 시 위험요인\n(2) 화약장전 시 준수사항", "a_text": "→ 강봉으로 화학류를 장전 시 마찰, 충격, 정전기 등에 의한 폭발 위험이 있음\n\n→ 장전구는 마찰, 충격, 정전기 등에 의한 폭발의 위험이 없는 안전한 것을 사용할 것", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["→ 강봉으로 화학류를 장전 시 마찰, 충격, 정전기 등에 의한 폭발 위험이 있음", "→ 장전구는 마찰, 충격, 정전기 등에 의한 폭발의 위험이 없는 안전한 것을 사용할 것"], "cat": "D", "cat_desc": "터널 화약 장전 위험요인"}, {"id": "i_118", "part": "i", "num": 118, "title": "다음 작업자들은 NATM 공법으로 터널 굴착 작업을 하고 있다.", "q_text": "터널굴착 장악 작업 시 준수사항(3가지)", "a_text": "① 화약, 폭약 장전 시 인근 화기 사용 및 흡연 등 금지\n② 장전구는 폭발 화재 우려가 없는 것을 사용할 것\n③ 발파공 충진재료는 발화성, 인화성 위험이 없는 재료를 사용할 것", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 화약, 폭약 장전 시 인근 화기 사용 및 흡연 등 금지\n② 장전구는 폭발 화재 우려가 없는 것을 사용할 것\n③ 발파공 충진재료는 발화성, 인화성 위험이 없는 재료를 사용할 것"], "cat": "D", "cat_desc": "터널 굴착 준수사항"}, {"id": "i_119", "part": "i", "num": 119, "title": "터널 굴착공사에서 사용되는 흙막이 지보공을 확대하여 보여주고 있다.", "q_text": "터널 굴착공사에서 사용되는 흙막이 지보공 점검사항(3가지)", "a_text": "① 부재의 손상/변형/부식/변위 및 탈락의 유무와 상태\n② 버팀대의 긴압의 정도\n③ 부재의 접속부/부착부 및 교차부의 상태", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 부재의 손상/변형/부식/변위 및 탈락의 유무와 상태\n② 버팀대의 긴압의 정도\n③ 부재의 접속부/부착부 및 교차부의 상태"], "cat": "A", "cat_desc": "흙막이 지보공 점검사항"}, {"id": "i_120", "part": "i", "num": 120, "title": "바닥에 눈이 쌓여 있고 갱폼의 하부는 철사로 고정되어 있으며 버팀대 고정이 제대로 되어지지 않은 상태에서 갱폼 설치작업을 하고 있다.", "q_text": "(1) 불안전한 상태(2가지)\n(2) 가이데릭 설치 시 고정방법에 대해 서술하시오.", "a_text": "① 갱폼이 하부만 고정되어 있어 갱폼이 무너질 위험 있음\n② 버팀대가 미끄러질 우려가 있음\n\n→ 와이어로프로 결속하여 고정", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 2}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["① 갱폼이 하부만 고정되어 있어 갱폼이 무너질 위험 있음\n② 버팀대가 미끄러질 우려가 있음", "→ 와이어로프로 결속하여 고정"], "cat": "A", "cat_desc": "갱폼 설치 불안전 상태"}, {"id": "i_121", "part": "i", "num": 121, "title": "작업자 A는 아파트 대형 창틀(창은 설치되어 있지 않음)에서, B는 약 50cm 벽을 두고 옆 처마 위에서 작업을 하고 있다. 작업장 주변은 정리정돈이 되어 있지 않다. 작업자 A가 창틀 밖으로 작업발판을 작업자 B에게 건네주는데, 작업자 B가 있는 옆 처마 위로 이동하다 (창틀 위) 콘트리트 조각을 밟고 미끄러져 콘크리트 조각과 함께 떨어진다.", "q_text": "(1) 위험요인(3가지)\n(2) 기인물\n(3) 가해물", "a_text": "① 작업발판 미설치\n② 추락방호망 미설치\n③ 안전대 미착용\n\n→ 콘크리트(돌) 조각\n\n→ 바닥", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 3}, {"label": "(2)", "type": "paren", "count": 1}, {"label": "(3)", "type": "paren", "count": 1}], "sub_answers": ["① 작업발판 미설치\n② 추락방호망 미설치\n③ 안전대 미착용", "→ 콘크리트(돌) 조각", "→ 바닥"], "cat": "A", "cat_desc": "아파트 창틀 작업 추락"}, {"id": "i_122", "part": "i", "num": 122, "title": "안전난간과 추락방호망이 설치되지 않은 (삼각형) 박공지붕 중간에서, 안전모와 안전화를 착용한 작업자들이 앉아 휴식 중이다. 작업자 뒤에 있던 삼각형 적재물이 굴러와 작업자의 등에 부딪혀 작업자가 앞으로 쓰러진다.", "q_text": "(1) 위험요인(3가지)\n(2) 안전대책(3가지)", "a_text": "① 지붕의 가장자리에 안전난간 없음\n② 추락방호망 없음\n③ 작업자가 안전대를 착용하지 않음\n\n① 지붕의 가장자리에 안전난간 설치\n② 추락방호망 설치\n③ 작업자가 안전대를 착용하고, 안전대 부착설비에 체결", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 3}, {"label": "(2)", "type": "paren", "count": 3}], "sub_answers": ["① 지붕의 가장자리에 안전난간 없음\n② 추락방호망 없음\n③ 작업자가 안전대를 착용하지 않음", "① 지붕의 가장자리에 안전난간 설치\n② 추락방호망 설치\n③ 작업자가 안전대를 착용하고, 안전대 부착설비에 체결"], "cat": "A", "cat_desc": "박공지붕 작업 추락"}, {"id": "i_123", "part": "i", "num": 123, "title": "철판집게로 철판을 “ㄷ”자로 물고 있는 이동식 크레인은 철판을 화물차 위로 이동시키고 있으며, 화물차 위에서 작업자가 이동해온 철판을 내리려는 찰나에 철판이 낙하하여 작업자가 깔리는 재해가 발생하였다. 옆에는 스위치를 조작하는 작업자가 1명 더 있고 유도로프는없으며, 크레인에 훅에는 해지장치가 없다.", "q_text": "(1) 양중기의 방호장치(4가지)\n(2) 영상을 보고 다음 보기의 빈칸을 채우시오.\n\n안전검사주기에서 사업장에서 설치가 끝난 날부터 ( ________ ) 이내에 최초 안전검사를 실시하되, 그 이후부터 매 ( ________ ) 마다 실시한다. 단, 건설현장에서 사용하는 것은 최초로 설치한 날로부터 ( ________ ) 마다 안전검사를 실시한다.", "a_text": "① 과부하방지장치\n② 비상정지장치\n③ 권과방지장치\n④ 제동장치\n\n", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 4}, {"label": "(2)-①", "type": "blank", "count": 1}, {"label": "(2)-②", "type": "blank", "count": 1}, {"label": "(2)-③", "type": "blank", "count": 1}], "sub_answers": ["① 과부하방지장치\n② 비상정지장치\n③ 권과방지장치\n④ 제동장치", "3년", "2년", "6개월"], "cat": "A", "cat_desc": "이동식 크레인 철판 인양"}, {"id": "i_124", "part": "i", "num": 124, "title": "건설공사 현장에서 이동식 크레인을 보여주고 있다.", "q_text": "이동식 크레인 작업시작 전 점검사항(3가지)", "a_text": "① 권과방지장치나 그 밖의 경보장치의 기능\n② 브레이크/클러치 및 조정장치의 기능\n③ 와이어로프가 통하고 있는 곳 및 작업장소의 지반상태", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 권과방지장치나 그 밖의 경보장치의 기능\n② 브레이크/클러치 및 조정장치의 기능\n③ 와이어로프가 통하고 있는 곳 및 작업장소의 지반상태"], "cat": "A", "cat_desc": "이동식 크레인 작업 전 점검"}, {"id": "i_125", "part": "i", "num": 125, "title": "운전자가 크레인 작업 중 비계를 로프에 걸어 작업자가 비계 아래에서 수신호 작업하다 신호가 맞지 않아 비계가 작업자 위로 낙하하는 재해가 발생하였다.", "q_text": "이동식 크레인 운전자가 준수하여야 할 사항(3가지)", "a_text": "① 이동식 크레인의 탑승과 하차는 승강 계단을 이용할 것\n② 작업(운전) 중에 운전위치 이탈 금지\n③ 인양작업 중 고장 발생 시 인양물을 지상에 내려놓고 브레이크와 안전장치를 작동상태로 유지할 것", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 이동식 크레인의 탑승과 하차는 승강 계단을 이용할 것\n② 작업(운전) 중에 운전위치 이탈 금지\n③ 인양작업 중 고장 발생 시 인양물을 지상에 내려놓고 브레이크와 안전장치를 작동상태로 유지할 것"], "cat": "A", "cat_desc": "이동식 크레인 운전자 준수사항"}, {"id": "i_126", "part": "i", "num": 126, "title": "크레인 작업자가 크고 두꺼운 배관을 와이어로프로 안전하지 못하게 단 한 번 빙 둘러서 인양하고 있다. 도중에 끈을 확대하여 보여주는데 끈의 일부분이 손상되어 찢겨져 있는 부분을 보여주었다. 배관을 다시 인양하던 도중에 아래에서 작업하던 작업자들의 머리 부근까지 내려오다가 배관이 순간 흔들리면서 날아와서 작업자를 그대로 가격하는 모습을 보여주고 있다.", "q_text": "크레인으로 배관을 인양하던 도중에 발새한 재해에 대한 동종 재해를 방지하기 위한 화물 인양 시 준수사항(3가지)", "a_text": "① 인양할 하물을 바닥에서 끌어당기거나 밀어내는 작업을 하지 말 것\n② 미리 근로자의 출입을 통제하여 인양 중인 하물이 작업자의 머리 위로 통과하지 않도록 할 것\n③ 고정된 물체를 직접 분리, 제거하는 작업을 하지 말 것", "sub_inputs": [{"label": "", "type": "single", "count": 3}], "sub_answers": ["① 인양할 하물을 바닥에서 끌어당기거나 밀어내는 작업을 하지 말 것\n② 미리 근로자의 출입을 통제하여 인양 중인 하물이 작업자의 머리 위로 통과하지 않도록 할 것\n③ 고정된 물체를 직접 분리, 제거하는 작업을 하지 말 것"], "cat": "A", "cat_desc": "크레인 배관 인양 준수사항"}, {"id": "i_127", "part": "i", "num": 127, "title": "작업자가 이동식크레인으로 배관을 1줄 걸이 상태로 불안정하게 운반하고 있으며, 와이어로프가 어느 정도 손상된 모습을 보여준다. 작업자들이 배관을 손으로 지지하다 배관이 흔들리며 작업자들이 배관에 맞는 재해가 발생하였다. (훅의 해지장치는 설치되지 않았다)", "q_text": "이동식 크레인 작업의 위험요인(2가지)", "a_text": "① 손상된 섬유로프 사용\n② 2줄 걸이 미실시\n③ 인양물 하부 작업자 출입 금지 미실시\n④ 유도 로프 미사용", "sub_inputs": [{"label": "", "type": "single", "count": 2}], "sub_answers": ["① 손상된 섬유로프 사용\n② 2줄 걸이 미실시\n③ 인양물 하부 작업자 출입 금지 미실시\n④ 유도 로프 미사용"], "cat": "A", "cat_desc": "이동식 크레인 위험요인"}, {"id": "i_128", "part": "i", "num": 128, "title": "크레인의 로프가 손상되어 있는 장면을 보여주고, 엘보우 부품을 인양하다가 인양물이 불안정하게 회전하며 내리다가 작업자의 머리를 가격하는 장면을 보여준다.", "q_text": "(1) 동종 재해를 방지하기 위해 작업 전 점검사항(3가지)\n(2) 동종 재해를 방지하기 위해 관리감독자의 유해/위험 방지(3가지)", "a_text": "① 권과방지장치, 브레이크, 클러치 및 운전장치의 기능\n② 주행로의 상측 또는 트롤리가 횡행하는 레일의 상태\n③ 와이어로프가 통하고 있는 곳의 상태\n\n① 작업방법과 근로자 배치를 결정하고 그 작업을 지휘하는 일\n② 재료의 결함 유무 또는 기구 및 공구의 기능을 점검하고 불량품을 제거하는 일\n③ 작업 중 안전대 또는 안전모의 착용 상황을 감시하는 일", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 3}, {"label": "(2)", "type": "paren", "count": 3}], "sub_answers": ["① 권과방지장치, 브레이크, 클러치 및 운전장치의 기능\n② 주행로의 상측 또는 트롤리가 횡행하는 레일의 상태\n③ 와이어로프가 통하고 있는 곳의 상태", "① 작업방법과 근로자 배치를 결정하고 그 작업을 지휘하는 일\n② 재료의 결함 유무 또는 기구 및 공구의 기능을 점검하고 불량품을 제거하는 일\n③ 작업 중 안전대 또는 안전모의 착용 상황을 감시하는 일"], "cat": "A", "cat_desc": "크레인 작업 전 점검·관리감독자"}, {"id": "i_129", "part": "i", "num": 129, "title": "한 작업자가 이동식 크레인으로 전주를 옮기는 과정에서 다른 작업자가 떨어진 전주에 맞아 사고가 발생하였다.", "q_text": "(1) 재해명칭\n(2) 가해물\n(3) 착용해야 하는 전기용 안전모의 종류(2가지)", "a_text": "① AE (낙하/비래/감전방지용 안전모)\n② ABE (다목적용 안전모, 낙하/비래/추락/감전)", "sub_inputs": [{"label": "(1)", "type": "paren", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}, {"label": "(3)", "type": "paren", "count": 2}], "sub_answers": ["→ 맞음", "→ 전주", "① AE (낙하/비래/감전방지용 안전모)\n② ABE (다목 ", "part": "i", "num": 100, "title": "화기주의, 인화성 물질이라고 써 있는 드럼통(200L)이 여러 개 보관된 창고 안에서 작업자가 인화성 물질이 든 운반용 캔(약 40L)을 몇 개 운반하다가 잠시 쉰다. 작업자가 작은 용기에 있는 걸 큰 용기에 담기 위해 드럼통 뚜껑을 열고 더운지 작업자가 스웨터를 벗는 도중에 폭발사고가 발생하였다. [변형 - 혼합]", "q_text": "(1) 다음 빈칸을 채우시오.\n① ( ________ ) 폭발 = VCE\n\n(1) 폭발의 종류\n(2) 정의\n(3) 인화성 물질의 증기/가연성가스 또는 분진이 존재하여 폭발 또는화재가 발생할 우려가 있을 경우의 예방대책(3가지)", "a_text": "→ 증기운 폭발 = VCE\n\n→ 인화성 가스가 대기 중에 존재하다가 점화원(정전기)에 의해 폭발\n\n① 환기가 충분하지 않으 ㄴ상태에서 전기기계기구를 작동시키지 않음\n② 환풍기, 배풍기 등 환기장치를 적절하게 설치\n③ 가스 검지 및 경보 성능을 갖춘 가스 검지 및 경보 장치를 설치", "sub_inputs": [{"label": "①", "type": "blank", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}, {"label": "(3)", "type": "paren", "count": 3}], "sub_answers": ["증기운", "→ 인화성 가스가 대기 중에 존재하다가 점화원(정전기)에 의해 폭발", "① 환기가 충분하지 않으 ㄴ상태에서 전기기계기구를 작동시키지 않음\n② 환풍기, 배풍기 등 환기장치를 적절하게 설치\n③ 가스 검지 및 경보 성능을 갖춘 가스 검지 및 경보 장치를 설치"], "cat": "D", "cat_desc": "인화성물질 증기운 폭발 (변형)", "is_variant": true}, {"id": "i_101_v", "part": "i", "num": 101, "title": "화면에서 프로판가스 용기들을 보여주고 있다. 작업자가 LPG저장소라고 표시되어 있는 문을 열고 들어가는데, 어두워서 들어 가자마자 왼쪽에 있는 스위치를 눌러서 불을 점등하려는 순간 스파크로 인해서 폭발이 일어나는 화면을 보여 준다. [변형 - 빈칸]", "q_text": "다음 빈칸에 알맞은 용어를 쓰시오.\n\n① ( ________ ) 환기가 불충분한 장소\n② ( ________ ) 장소 및 그 부근\n③ ( ________ ) 액체를 취급하는 장소 및 그 부근", "a_text": "통풍이나\n화기를 사용하는\n위험물 또는 인화성", "sub_inputs": [{"label": "①", "type": "blank", "count": 1}, {"label": "②", "type": "blank", "count": 1}, {"label": "③", "type": "blank", "count": 1}], "sub_answers": ["통풍이나", "화기를 사용하는", "위험물 또는 인화성"], "cat": "D", "cat_desc": "프로판가스 저장소 부적합 장소 (변형)", "is_variant": true}, {"id": "i_102_v", "part": "i", "num": 102, "title": "해당 LPG저장소에는 가스누설감지경보기가 설치되지 않아 작업자들이 가스 폭발사고를 당했다. [변형 - 혼합]", "q_text": "(1) 누설감지경보기 적절한 설치 위치\n(2) 누설감지경보기 경보설정 값\n\n(1) 다음 빈칸을 채우시오.\n① ( ________ ) 바닥 근처 낮은곳에 설치\n\n(2) (2) 항목을 1가지 서술하시오.", "a_text": "→ LPG는 공기보다 무거우므로 바닥 근처 낮은곳에 설치\n\n→ 폭발하한계의 25% 이하", "sub_inputs": [{"label": "①", "type": "blank", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["LPG는 공기보다 무거우므로", "→ 폭발하한계의 25% 이하"], "cat": "D", "cat_desc": "LPG 가스 누설감지경보기 (변형)", "is_variant": true}, {"id": "i_103_v", "part": "i", "num": 103, "title": "작업자가 LPG저장소라고 표시되어 있는 문을 열고 들어가는데, 어두워서 들어 가자마자 왼쪽에 있는 스위치를 눌러서 불을 점등하려는 순간 스파크로 인해서 폭발이 일어나는 화면을 보여 준다. [변형 - 혼합]", "q_text": "(1) 재해형태\n(2) 기인물\n\n(1) 다음 빈칸을 채우시오.\n① ( ________ )\n\n(2) (2) 항목을 1가지 서술하시오.", "a_text": "→ 폭발\n\n→ LPG", "sub_inputs": [{"label": "①", "type": "blank", "count": 1}, {"label": "(2)", "type": "paren", "count": 1}], "sub_answers": ["폭발", "→ LPG"], "cat": "D", "cat_desc": "LPG 폭발 재해형태 (변형)", "is_variant": true}, {"id": "i_104_v", "part": "i", "num": 104, "title": "화면에서 화학물질을 소분하여 저장한 통에 MSDS 라벨을 부착한 모습을 확대하여 보여 주고 있다. [변형 - 빈칸]", "q_text": "다음 빈칸에 알맞은 용어를 쓰시오.\n\n① ( ________ )\n② ( ________ ) 보건상의 취급 주의 사항\n③ ( ________ ) 보건상의 취급 주의 사항\n④ ( ________ ) 특성 등 고용노동부령으로 정하는 사항", "a_text": "제품명\n안전 및\n안전 및\n물리, 화학적", "sub_inputs": [{"label": "①", "type": "blank", "count": 1}, {"label": "②", "type": "blank", "count": 1}, {"label": "③", "type": "blank", "count": 1}, {"label": "④", "type": "blank", "count": 1}], "sub_answers": ["제품명", "안전 및", "안전 및", "물리, 화학적"], "cat": "D", "cat_desc": "MSDS 물질안전보건자료 작성사항 (변형)", "is_variant": true}, {"id": "i_105_v", "part": "i", "num": 105, "title": "작업자가 크롬도금 공정 중 도금의 상태를 점검하고 있다. [변형 - 혼합]", "q_text": "(1) 다음 빈칸을 채우시오.\n① ( ________ )\n② ( ________ )\n③ ( ________ )\n\n(1) 도금조에 국소 배기장치 종류(3가지)\n(2) 크롬산 미스트 억제 방법\n(3) 국소배기장치 설치 기준 - 후드(3가지)\n(4) 국소배기장치 설치 기준 - 덕트(3가지)\n(5) 유해물질 취급 시 일반적 주의사항(4가지)", "a_text": "① PUSH-PULL\n② 측방형\n③ 슬롯형\n\n① 도금크롬조에 플라스틱 볼을 넣어서 크롬산 미스트 발생을 최소화\n② 계면활성제와 도금액을 같이 투입하여 크롬산 미스트 발생을 억제\n\n① 유해물질 발생지역마다 후드 설치\n② 분진 및 기타 유해물질의 발생 형태, 비중, 작업 방법 등을 고려하여 해당 배출원을 제어할 수 있는 구조로 설치\n③ 가능하면 포위식 또는 부스식 후드 설치\n\n① 가능하면 덕트 길이는 짧게 하고 굴곡부의 수는 적게 함\n② 접속부의 안쪽은 돌출된 부분이 없도록 함\n③ 청소하기 쉬운 구조로 청소구 설치\n\n① 유해물질에 대한 사전 조사\n② 유해물 발생원인 봉쇄\n③ 작업공정의 은폐 및 작업장의 격리\n④ 환경의 정돈과 청소", "sub_inputs": [{"label": "①", "type": "blank", "count": 1}, {"label": "②", "type":         <div class="sec-dot" style="background:${c.c}"></div>
        <div class="sec-nm" style="color:${c.c}">${c.i} ${c.n}</div>
        <div class="sec-line"></div>
        <div class="sec-cnt">${cnt}문항</div>
        <button class="sec-rst" onclick="rstSec('${q.cat}')">↺ 초기화</button>
      </div>`;
    }
    html+=buildCard(q,idx+1);
  });
  con.innerHTML=html;upAll();requestAnimationFrame(initAutoGrow);
}

/* ── q_text 렌더링 (표 포함 가능) ── */
function renderQText(q_text){
  if(!q_text) return '';
  // 표가 포함된 경우
  if(q_text.includes('|') && q_text.includes('---')){
    return renderQWithTable(q_text);
  }
  let t=E(q_text);
  t=t.replace(/&quot;([^&]+)&quot;/g,(_,m)=>`<div class="scenario">"${m}"</div>`);
  t=t.replace(/\(\s*_{3,}\s*\)/g,'<span class="blank-highlight">　　　　</span>');
  return `<div class="qtext">${t}</div>`;
}

function renderQWithTable(text){
  const lines=text.split('\n');
  let preLines=[],tableRows=[],postLines=[],inTable=false;
  for(const line of lines){
    if(line.trim().startsWith('|')){inTable=true;tableRows.push(line.trim());}
    else if(inTable){postLines.push(line);}
    else{preLines.push(line);}
  }
  let html='';
  const preText=preLines.join('\n').trim();
  if(preText){
    let t=E(preText);
    t=t.replace(/&quot;([^&]+)&quot;/g,(_,m)=>`<div class="scenario">"${m}"</div>`);
    t=t.replace(/\(\s*_{3,}\s*\)/g,'<span class="blank-highlight">　　　　</span>');
    html+=`<div class="qtext">${t}</div>`;
  }
  if(tableRows.length>=2) html+=buildQTable(tableRows);
  const postText=postLines.join('\n').trim();
  if(postText) html+=`<div class="qtext" style="margin-top:5px">${E(postText)}</div>`;
  return html;
}

function buildQTable(rows){
  const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());
  const headers=cells(rows[0]);
  const dataRows=rows.slice(2);
  let html='<table class="q-table"><thead><tr>';
  headers.forEach(h=>{html+=`<th>${E(h)}</th>`;});
  html+='</tr></thead><tbody>';
  dataRows.forEach(r=>{
    html+='<tr>';
    cells(r).forEach(cell=>{
      if(/_{3,}/.test(cell)){
        html+=`<td><span class="blank-highlight">　　　</span></td>`;
      }else{
        html+=`<td>${E(cell)}</td>`;
      }
    });
    html+='</tr>';
  });
  return html+'</tbody></table>';
}

/* ── 카드 빌드 ── */
function buildCard(q,n){
  const s=S[q.id]||{};
  const c=CAT[q.cat]||{c:'#888',l:'#f5f5f5',i:'',n:''};
  const subs=q.sub_inputs||[{label:'',type:'single',count:1}];
  const sg=subs.length===1&&!subs[0].label;
  const opCls=s.open?' op':'';const sCls=s.starred?' starred':'';
  const seenDot=s.seen?'<div class="sdot"></div>':'';
  const si=s.starred?'★':'☆';
  const ansShown=RV[q.id];

  const qHtml=q.q_text?renderQText(q.q_text):'';
  const inputHtml=buildInput(q,subs,sg);
  const ansHtml=buildAns(q,subs,sg);

  return`<div class="qc${opCls}${sCls}" id="C${q.id}" data-cat="${q.cat}">
    <div class="qhdr" onclick="togCard('${q.id}')">
      <div class="qnum" style="background:${c.c}">${n}</div>
      <div class="qcat" style="background:${c.l};color:${c.c};border-color:${c.c}33">${c.i} ${c.n}</div>
      <div class="qpart">${q.pL}</div>
      ${q.isVar ? '<div class="qpart" style="background:var(--ink-lt);color:var(--ink);border-color:var(--ink-mid)">🔄 변형</div>' : ''}
      <div class="qtitle">${E(q.title)}</div>
      <div class="qno">Q${q.num}</div>
      ${seenDot}
      <button class="sbtn${s.starred?' on':''}" id="sb_${q.id}" onclick="togStar('${q.id}',event)">${si}</button>
      <span class="chev">▾</span>
    </div>
    <div class="qbody"><div class="qbody-inner">
      <div class="card-body-layout">
        <div class="card-left">
          <div class="qcon">${qHtml}</div>
          <div class="as">
            <div class="as-lbl">내 답안</div>
            ${inputHtml}
            <div class="brow">
              <button class="b-check" onclick="chkAns('${q.id}')">채점하기</button>
              <button class="b-show" id="bs_${q.id}" onclick="togAns('${q.id}')">${ansShown?'정답 숨기기':'정답 보기'}</button>
              <button class="b-rst" onclick="rstQ('${q.id}')">↺ 초기화</button>
              <span class="cr" id="cr_${q.id}"></span>
            </div>
          </div>
        </div>
        <div class="card-right${ansShown?' show':''}" id="ar_${q.id}">
          <div class="ap-inner">
            <div class="ap-lbl">모범 정답</div>
            ${ansHtml}
          </div>
        </div>
      </div>
    </div></div>
  </div>`;
}

function buildInput(q,subs,sg){
  if(sg){
    const cnt=subs[0]?.count>1?subs[0].count:1;
    if(cnt>1){
      let h='<div class="sub-inputs">';
      for(let ci=0;ci<cnt;ci++)
        h+=`<div class="sub-row"><div class="sub-label cnt-label">${ci+1}</div>
          <textarea class="sub-ta" id="sub_${q.id}_0_${ci}" rows="1"
            oninput="sv();autoGrow(this)" onkeydown="ke(event,'${q.id}',${ci===cnt-1})"></textarea></div>`;
      return h+'</div>';
    }
    return `<textarea class="ta" id="ta_${q.id}" rows="2" placeholder="답안을 입력하세요..."
      oninput="sv();autoGrow(this)" onkeydown="ke(event,'${q.id}',true)"></textarea>`;
  }
  let h='<div class="sub-inputs">';
  subs.forEach((sub,i)=>{
    const cnt=sub.count>1?sub.count:1;
    const isLast=i===subs.length-1;
    const isBlank=sub.type==='blank';
    if(cnt>1){
      h+=`<div class="sub-group"><div class="sub-group-label">${sub.label||(i+1)}</div><div class="sub-group-items">`;
      for(let ci=0;ci<cnt;ci++){
        const il=isLast&&ci===cnt-1;
        h+=`<div class="sub-item-row"><div class="sub-item-num">${ci+1}</div>
          <textarea class="sub-ta" id="sub_${q.id}_${i}_${ci}" rows="1"
            oninput="sv();autoGrow(this)" onkeydown="ke(event,'${q.id}',${il})"></textarea></div>`;
      }
      h+='</div></div>';
    }else{
      const lblCls=isBlank?'sub-label blank':'sub-label';
      h+=`<div class="sub-row"><div class="${lblCls}">${sub.label||(i+1)}</div>
        <textarea class="sub-ta" id="sub_${q.id}_${i}_0" rows="1"
          oninput="sv();autoGrow(this)" onkeydown="ke(event,'${q.id}',${isLast})"></textarea></div>`;
    }
  });
  return h+'</div>';
}

function buildAns(q,subs,sg){
  const sa=q.sub_answers||[q.a_text||''];
  if(sg) return `<div class="ans-single">${fmtA(sa[0]||q.a_text||'')}</div>`;
  let h='<div class="ans-sub-list">';
  subs.forEach((sub,i)=>h+=`<div class="ans-sub-row">
    <div class="ans-sub-lbl">${sub.label||(i+1)}</div>
    <div class="ans-sub-cnt">${fmtA(sa[i]||'')}</div></div>`);
  return h+'</div>';
}

/* ── 액션 ── */
function togCard(qid){
  const c=gi('C'+qid);const op=c.classList.toggle('op');
  if(!S[qid])S[qid]={};S[qid].open=op;
}
function togAns(qid){
  const ap=gi('ar_'+qid);if(!ap)return;

  gi('bs_'+qid).textContent=sh?'정답 숨기기':'정답 보기';

function togStar(qid,e){

function rstQ(qid){
  const w=S[qid]?.starred;S[qid]=w?{starred:true}:{};RV[qid]=false;

  upAll();save();
}

/* ── Enter ── */
function ke(e,qid,isLast){
  // Enter키: 어느 칸에서든 줄바꿈 없이 채점+정답 오픈
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    doChk(qid);
    return;
  }
}
function doChk(qid){chkAns(qid);openAns(qid);}

/* ── 채점 ── */
function norm(t){
  if(!t)return'';
  return t
    .replace(/[→①②③④⑤⑥⑦⑧⑨⑩•·,\.\/\[\]「」『』【】:]/g,'')
    .replace(/[()]/g,'')
    .replace(/\s+/g,'')
    .replace(/에서|에게|으로|하는|하여|하고|실시|함(?=[^가-힣]|$)|것(?=[^이]|$)|를|을|은|는|이(?=[가-힣])|가(?=[가-힣])|와|과|도|에|의/g,'')
    .toLowerCase();
}
function sim(u,a){
  if(!u||!u.trim())return 0;
  if(!a||!a.trim())return 1;
  const vv=[a];
  const np=a.replace(/\([^)]*\)/g,'').trim();
  if(np&&np!==a)vv.push(np);
  let best=0;
  for(const av of vv){
    const un=norm(u),an=norm(av);
    if(!un){best=Math.max(best,0);continue;}
    if(!an){best=1;break;}
    const ac={},uc={};
    for(const c of an)ac[c]=(ac[c]||0)+1;
    for(const c of un)uc[c]=(uc[c]||0)+1;
    let m=0;
    for(const[c,n]of Object.entries(ac))m+=Math.min(n,uc[c]||0);
    const s=m/an.length;if(s>best)best=s;
  }
  return best;
}
function extLines(t){
  if(!t)return[''];
  const ls=t.split('\n').map(l=>l.replace(/^[①②③④⑤⑥⑦⑧⑨⑩→•\-]\s*/,'').trim()).filter(l=>l.length>=1);
  return ls.length?ls:[t];
}
const THR=0.90;

function chkAns(qid){
  const q=QS.find(q=>q.id===qid);if(!q)return 0;
  const subs=q.sub_inputs||[{label:'',type:'single',count:1}];
  const sa=q.sub_answers||[q.a_text||''];
  const sg=subs.length===1&&!subs[0].label;
  let tot=0,cor=0;
  function chkEl(el,ansStr){
    const val=el?.value?.trim()||'';tot++;
    if(!val){el?.classList.remove('ok','ng');return;}
    const al=extLines(ansStr);
    const s=al.length>1?bms(val,al):sim(val,ansStr);
    const ok=s>=THR;
    el?.classList.toggle('ok',ok);el?.classList.toggle('ng',!ok);
    if(!ok && el?.value?.trim()){
      el.classList.add('shake');
      setTimeout(()=>el?.classList.remove('shake'), 450);
    }
    if(ok)cor++;
  }
  if(sg){
    const cnt=subs[0]?.count>1?subs[0].count:1;
    if(cnt>1){
      const al=extLines(sa[0]||'');const used=new Set();
      for(let ci=0;ci<cnt;ci++){
        const el=gi(`sub_${qid}_0_${ci}`);const val=el?.value?.trim()||'';tot++;
        if(!val){el?.classList.remove('ok','ng');continue;}
        let bs=0,bi=-1;
        al.forEach((l,i)=>{if(used.has(i))return;const s=sim(val,l);if(s>bs){bs=s;bi=i;}});
        const ok=bs>=THR;if(ok&&bi>=0)used.add(bi);
        el?.classList.toggle('ok',ok);el?.classList.toggle('ng',!ok);
    if(!ok && el?.value?.trim()){
      el.classList.add('shake');
      setTimeout(()=>el?.classList.remove('shake'), 450);
    }if(ok)cor++;
      }
    }else chkEl(gi('ta_'+qid),sa[0]||'');
  }else{
    subs.forEach((sub,i)=>{
      const cnt=sub.count>1?sub.count:1;const as=sa[i]||'';
      if(cnt>1){
        const al=extLines(as);const used=new Set();
        for(let ci=0;ci<cnt;ci++){
          const el=gi(`sub_${qid}_${i}_${ci}`);const val=el?.value?.trim()||'';tot++;
          if(!val){el?.classList.remove('ok','ng');continue;}
          let bs=0,bi=-1;
          al.forEach((l,idx)=>{if(used.has(idx))return;const s=sim(val,l);if(s>bs){bs=s;bi=idx;}});
          const ok=bs>=THR;if(ok&&bi>=0)used.add(bi);
          el?.classList.toggle('ok',ok);el?.classList.toggle('ng',!ok);
    if(!ok && el?.value?.trim()){
      el.classList.add('shake');
      setTimeout(()=>el?.classList.remove('shake'), 450);
    }if(ok)cor++;
        }
      }else chkEl(gi(`sub_${qid}_${i}_0`),as);
    });
  }
  const cr=gi('cr_'+qid);
  if(cr&&tot>0){
    const all=cor===tot,pct=Math.round(cor/tot*100);
    let icon,cls;
    if(all){icon='✓';cls='aok';}
    else if(cor>0){icon='△';cls='part';}
    else{icon='✗';cls='ang';}
    if(tot===1){
      cr.textContent=all?`${icon} 정답`:`${icon} 오답`;
      cr.className=`cr show ${cls}`;
    }else{
      // 부분정답 bar 렌더링
      const fillColor=all?'var(--ok)':cor>0?'var(--star)':'var(--ng)';
      const fillW=Math.round(cor/tot*100);
      cr.innerHTML=`<span>${icon} ${cor}/${tot}</span>
        <span class="cr-bar"><span class="cr-bar-fill" style="width:0%;background:${fillColor}"></span></span>`;
      cr.className=`cr show cr-bar-wrap ${cls}`;
      // 바 애니메이션
      requestAnimationFrame(()=>{
        const fill=cr.querySelector('.cr-bar-fill');
        if(fill) fill.style.width=fillW+'%';
      });
    }
    if(all){
      const c=gi('C'+qid);c?.classList.add('all-correct','pop-ok');
      setTimeout(()=>c?.classList.remove('pop-ok'),400);
      // 헤더 flash
      const hdr=c?.querySelector('.qhdr');
      if(hdr){hdr.classList.add('flash-ok');setTimeout(()=>hdr?.classList.remove('flash-ok'),650);}
    }
  }
  save();return cor/Math.max(tot,1);
}
function bms(u,al){
  const ul=u.split('\n').map(l=>l.trim()).filter(l=>l);
  if(!ul.length)return 0;
  if(ul.length===1){let b=0;al.forEach(a=>{const s=sim(u,a);if(s>b)b=s;});return b;}
  const used=new Set();let m=0;
  ul.forEach(l=>{let b=0,bi=-1;al.forEach((a,i)=>{if(used.has(i))return;const s=sim(l,a);if(s>b){b=s;bi=i;}});if(b>=THR&&bi>=0){used.add(bi);m++;}});
  return m/al.length;
}

/* ── 정답 포맷 ── */
function fmtA(t){
  if(!t||!t.trim())return'<span style="color:var(--tx4)">-</span>';
  if(t.includes('|')){
    const ls=t.split('\n');let r='',inT=false,tr=[];
    for(const l of ls){
      if(l.trim().startsWith('|')){inT=true;tr.push(l.trim());}
      else{if(inT){r+=mdTbl(tr);inT=false;tr=[];}if(l.trim())r+=`<div class="ans-line">${E(l.trim())}</div>`;}
    }
    if(inT)r+=mdTbl(tr);return r;
  }
  return t.split('\n').filter(l=>l.trim()).map(l=>{
    const s=l.trim();
    const cM=s.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*(.*)$/);
    if(cM)return`<div class="ans-item"><span class="ans-bullet">${cM[1]}</span><span class="ans-content">${E(cM[2])}</span></div>`;
    const dM=s.match(/^-\s+(.+)$/);
    if(dM)return`<div class="ans-item"><span class="ans-bullet">·</span><span class="ans-content">${E(dM[1])}</span></div>`;
    const aM=s.match(/^→\s*(.+)$/);
    if(aM)return`<div class="ans-arrow"><span class="ans-bullet" style="color:var(--ok)">→</span><span class="ans-content">${E(aM[1])}</span></div>`;
    return`<div class="ans-line">${E(s)}</div>`;
  }).join('');
}
function mdTbl(rows){
  if(rows.length<2)return rows.map(r=>E(r)).join('<br>');
  const cells=r=>r.split('|').slice(1,-1).map(c=>c.trim());
  const h=cells(rows[0]);
  let html='<table class="ans-table"><thead><tr>';
  h.forEach(c=>{html+=`<th>${E(c)}</th>`;});
  html+='</tr></thead><tbody>';
  rows.slice(2).forEach(r=>{html+='<tr>';cells(r).forEach(c=>{html+=`<td>${E(c)}</td>`;});html+='</tr>';});
  return html+'</tbody></table>';
}

/* ── 통계 ── */
function upAll(){
  const seen=Object.values(S).filter(s=>s?.seen).length;
  const starred=Object.values(S).filter(s=>s?.starred).length;
  const V=vis();
  gi('prog').style.width=Math.round(seen/QS.length*100)+'%';
  // 원형 진행
  const circle=gi('prog-circle');
  if(circle){
    const pct=QS.length>0?seen/QS.length:0;
    const dash=34.6;
    circle.setAttribute('stroke-dashoffset', (dash*(1-pct)).toFixed(2));
    circle.setAttribute('stroke', seen>0?'var(--ink)':'var(--tx4)');
  }
  gi('sv-tot').textContent=V.length;gi('sv-done').textContent=seen;gi('sv-star').textContent=starred;
  gi('sp-done')?.classList.toggle('lit',seen>0);gi('sp-star')?.classList.toggle('lit',starred>0);
}

/* ── 탭 전환 ── */
function switchTab(tab, btn) {
  if(curTab === tab) return;
  curTab = tab;
  QS = tab === 'orig' ? QS_ORIG : QS_VAR;
  // 탭 버튼 상태
  qsa('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // 필터 초기화
  filt = {part:'all', cat:'all', st:'all'};
  qsa('.fb').forEach(b => b.classList.remove('on'));
  qsa('.fb[data-v="all"]').forEach(b => b.classList.add('on'));
  // 순서 초기화
  ord = QS.map((_,i) => i);
  LS = tab === 'orig' ? LS_ORIG : LS_VAR;
  S = {}; RV = {};
  const saved = load();
  // 탭 전환 fade
  const main = gi('main');
  main.classList.add('fading');
  setTimeout(() => {
    render();
    main.classList.remove('fading');
    setTimeout(() => { restore(saved); initAutoGrow(); }, 50);
  }, 140);
}

function gi(id){return document.getElementById(id);}
function qs(sel){return document.querySelector(sel);}
function qsa(sel){return document.querySelectorAll(sel);}
function E(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── textarea auto-grow ── */
function autoGrow(el) {
  if(!el) return;
  el.style.height = 'auto';
  el.style.height = Math.max(el.scrollHeight, 34) + 'px';
}
function initAutoGrow() {
  qsa('textarea').forEach(ta => {
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight, ta.rows*22) + 'px';
    ta.addEventListener('input', () => autoGrow(ta));
  });
}

function sv(){clearTimeout(_t);_t=setTimeout(save,600);}

const _saved=load();render();
setTimeout(()=>{restore(_saved);initAutoGrow();},50);
</script>
